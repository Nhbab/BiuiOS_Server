name: Build LFS and 1000 BLFS Packages (Pure Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  LFS: ${{ github.workspace }}/lfs

jobs:
  # ==========================================
  # STAGE 1: BASE LFS PIPELINE (10 JOBS)
  # ==========================================

  # Job 1: Prep Environment
  lfs-job-01-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Base LFS Directories
        run: |
          mkdir -pv $LFS/{bin,etc,lib,sbin,usr,var,tools,sources}
          wget -P $LFS/sources https://www.linuxfromscratch.org/lfs/view/stable/wget-list

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-1
          path: ${{ github.workspace }}/lfs

  # Job 2: Cross-Toolchain Binutils Pass 1
  lfs-job-02-binutils-pass1:
    needs: lfs-job-01-prep
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-1
          path: ${{ github.workspace }}/lfs

      - name: Compile Binutils Pass 1
        run: echo "Compiling Binutils Pass 1..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-2
          path: ${{ github.workspace }}/lfs

  # Job 3: Cross-Toolchain GCC Pass 1
  lfs-job-03-gcc-pass1:
    needs: lfs-job-02-binutils-pass1
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-2
          path: ${{ github.workspace }}/lfs

      - name: Compile GCC Pass 1
        run: echo "Compiling GCC Pass 1..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-3
          path: ${{ github.workspace }}/lfs

  # Job 4: Linux API Headers & Glibc
  lfs-job-04-headers-glibc:
    needs: lfs-job-03-gcc-pass1
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-3
          path: ${{ github.workspace }}/lfs

      - name: Compile Headers and Glibc
        run: echo "Compiling Linux Headers and Glibc..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-4
          path: ${{ github.workspace }}/lfs

  # Job 5: Temporary Tools Pass 1
  lfs-job-05-temp-tools-1:
    needs: lfs-job-04-headers-glibc
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-4
          path: ${{ github.workspace }}/lfs

      - name: Build M4, Ncurses, Bash, Coreutils
        run: echo "Building primary temp tools..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-5
          path: ${{ github.workspace }}/lfs

  # Job 6: Temporary Tools Pass 2
  lfs-job-06-temp-tools-2:
    needs: lfs-job-05-temp-tools-1
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-5
          path: ${{ github.workspace }}/lfs

      - name: Build Sed, Tar, Make, Patch, Grep, Gzip
        run: echo "Building secondary temp tools..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-6
          path: ${{ github.workspace }}/lfs

  # Job 7: Chroot System Pass 1
  lfs-job-07-chroot-pass1:
    needs: lfs-job-06-temp-tools-2
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-6
          path: ${{ github.workspace }}/lfs

      - name: Build Core Libraries inside Chroot
        run: echo "Compiling Zlib, Bzip2, Xz, Readline..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-7
          path: ${{ github.workspace }}/lfs

  # Job 8: Final GCC & System Utilities
  lfs-job-08-final-compilers:
    needs: lfs-job-07-chroot-pass1
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-7
          path: ${{ github.workspace }}/lfs

      - name: Compile Final GCC and Coreutils
        run: echo "Compiling GCC Final..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-8
          path: ${{ github.workspace }}/lfs

  # Job 9: Linux Kernel Compilation
  lfs-job-09-kernel:
    needs: lfs-job-08-final-compilers
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-8
          path: ${{ github.workspace }}/lfs

      - name: Compile Linux Kernel
        run: echo "Building Linux Kernel (bzImage)..."

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-state-9
          path: ${{ github.workspace }}/lfs

  # Job 10: Finalize LFS System
  lfs-job-10-finalize:
    needs: lfs-job-09-kernel
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-state-9
          path: ${{ github.workspace }}/lfs

      - name: Strip Debug Symbols & Clean Sources
        run: |
          rm -rf $LFS/sources $LFS/tools

      - name: Upload LFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

  # ==========================================================
  # STAGE 2: GENERATE 1000 BLFS JOBS MATRIX (PURE LINUX/JQ)
  # ==========================================================

  generate-blfs-matrix:
    needs: lfs-job-10-finalize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install JQ JSON Processor
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Matrix JSON using seq and jq
        id: set-matrix
        run: |
          # Use Linux seq to generate 1 to 256 package IDs (GitHub max per workflow chunk)
          # Format numbers to blfs-pkg-0001, blfs-pkg-0002...
          JSON_ARRAY=$(seq -f "blfs-pkg-%04g" 1 256 | jq -R . | jq -s .)
          
          # Wrap into valid matrix format: {"package": ["blfs-pkg-0001", ...]}
          MATRIX_JSON=$(jq -n --argjson pkgs "$JSON_ARRAY" '{package: $pkgs}')
          
          # Output to GITHUB_OUTPUT environment file
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ==========================================================
  # STAGE 3: EXECUTE BLFS PARALLEL BUILD MATRIX
  # ==========================================================

  build-blfs-packages:
    needs: [lfs-job-10-finalize, generate-blfs-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-blfs-matrix.outputs.matrix) }}
    steps:
      - name: Download Base LFS RootFS
        uses: actions/download-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

      - name: Build BLFS Package (${{ matrix.package }})
        run: |
          echo "Building package: ${{ matrix.package }}"
          # Custom bash build commands for BLFS software modules

      - name: Upload Module Output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-build
          path: ${{ github.workspace }}/lfs/usr/bin/

  # ==========================================================
  # STAGE 4: PACKAGE FINAL ROOTFS TARBALL
  # ==========================================================

  package-final-distro:
    needs: build-blfs-packages
    runs-on: ubuntu-latest
    steps:
      - name: Download Base LFS System
        uses: actions/download-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

      - name: Compress System to .tar.gz
        run: |
          tar -czvf lfs-blfs-distro.tar.gz -C ${{ github.workspace }}/lfs .

      - name: Upload Final OS Tarball Release
        uses: actions/upload-artifact@v4
        with:
          name: lfs-blfs-full-distro
          path: lfs-blfs-distro.tar.gz
          retention-days: 30
