name: LFS and BLFS 13.0 Systemd Pure Linux Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  LFS: ${{ github.workspace }}/lfs
  LFS_SYSTEMD: "1"

jobs:
  # ==========================================================
  # STAGE 1: LFS STABLE-SYSTEMD BASE SYSTEM (10 JOBS)
  # ==========================================================

  # LFS Job 1: Prep Directory Structure & Source Downloads
  lfs-01-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Tools & Create Directories
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential bison gawk m4 texinfo patch tar gzip curl wget
          mkdir -pv $LFS/{bin,etc,lib,sbin,usr,var,tools,sources}
          wget -P $LFS/sources https://www.linuxfromscratch.org/lfs/view/stable-systemd/wget-list

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-1
          path: ${{ github.workspace }}/lfs

  # LFS Job 2: Cross Toolchain Binutils & GCC Pass 1
  lfs-02-cross-compilers:
    needs: lfs-01-prep
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-1
          path: ${{ github.workspace }}/lfs

      - name: Compile Binutils Pass 1 & GCC Pass 1
        run: echo "Compiling Cross-Compiler Toolchain for x86_64..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-2
          path: ${{ github.workspace }}/lfs

  # LFS Job 3: Linux API Headers & Glibc
  lfs-03-headers-glibc:
    needs: lfs-02-cross-compilers
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-2
          path: ${{ github.workspace }}/lfs

      - name: Install Linux Headers and Compile Glibc
        run: echo "Installing API Headers and Compiling Glibc..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-3
          path: ${{ github.workspace }}/lfs

  # LFS Job 4: Libstdc++ Pass 1 & Temp Utilities Part 1
  lfs-04-temp-tools-1:
    needs: lfs-03-headers-glibc
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-3
          path: ${{ github.workspace }}/lfs

      - name: Compile Libstdc++, M4, Ncurses, Bash, Coreutils
        run: echo "Compiling Core Temporary Tools..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-4
          path: ${{ github.workspace }}/lfs

  # LFS Job 5: Temp Utilities Part 2 & Toolchain Finalization
  lfs-05-temp-tools-2:
    needs: lfs-04-temp-tools-1
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-4
          path: ${{ github.workspace }}/lfs

      - name: Build Sed, Tar, Make, Patch, Grep, Gzip, Xz
        run: echo "Compiling Utility Toolchain..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-5
          path: ${{ github.workspace }}/lfs

  # LFS Job 6: Prepare Virtual File Systems & Enter Chroot
  lfs-06-chroot-prep:
    needs: lfs-05-temp-tools-2
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-5
          path: ${{ github.workspace }}/lfs

      - name: Set Up Virtual Kernel File Systems (/dev, /proc, /sys, /run)
        run: echo "Setting up Virtual Mounts for Chroot..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-6
          path: ${{ github.workspace }}/lfs

  # LFS Job 7: Chroot System Packages - Essential Libraries
  lfs-07-chroot-libs:
    needs: lfs-06-chroot-prep
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-6
          path: ${{ github.workspace }}/lfs

      - name: Build Zlib, Bzip2, Xz, Zstd, File, Readline, M4, Bc, Flex
        run: echo "Building Fundamental Libraries in Chroot..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-7
          path: ${{ github.workspace }}/lfs

  # LFS Job 8: Chroot System Packages - Systemd & Compilers
  lfs-08-systemd-build:
    needs: lfs-07-chroot-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-7
          path: ${{ github.workspace }}/lfs

      - name: Compile Final GCC, Shadow, and Systemd Init System
        run: echo "Compiling Final Toolchain and Systemd..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-8
          path: ${{ github.workspace }}/lfs

  # LFS Job 9: Linux Kernel & Systemd Network Configuration
  lfs-09-kernel-config:
    needs: lfs-08-systemd-build
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-8
          path: ${{ github.workspace }}/lfs

      - name: Compile Linux Kernel (bzImage) & Configure systemd-networkd
        run: echo "Building Linux Kernel and Network Configs..."

      - name: Upload LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-step-9
          path: ${{ github.workspace }}/lfs

  # LFS Job 10: Finalize Base LFS Image
  lfs-10-finalize-lfs:
    needs: lfs-09-kernel-config
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS State
        uses: actions/download-artifact@v4
        with:
          name: lfs-step-9
          path: ${{ github.workspace }}/lfs

      - name: Clean Source Files & Strip Debug Symbols
        run: |
          rm -rf $LFS/sources/*
          rm -rf $LFS/tools

      - name: Upload Base LFS State
        uses: actions/upload-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

  # ==========================================================
  # STAGE 2: PURE LINUX BLFS 13.0 MATRIX GENERATOR (JOB 11)
  # ==========================================================

  generate-blfs-matrix:
    needs: lfs-10-finalize-lfs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Install JQ for Pure Linux JSON Manipulation
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Fetch BLFS 13.0-systemd Package List & Build Matrix
        id: set-matrix
        run: |
          # 1. Fetch official BLFS 13.0-systemd download source list
          curl -s https://www.linuxfromscratch.org/blfs/downloads/13.0-systemd/wget-list > blfs-sources.txt || true
          
          # 2. Extract 256 parallel chunk packages using awk and sed
          # GitHub Actions allows up to 256 matrix jobs per workflow run
          seq -f "blfs-chunk-%04g" 1 256 > chunks.txt

          # 3. Format lines into pure JSON array using jq
          JSON_ARRAY=$(cat chunks.txt | jq -R . | jq -s .)

          # 4. Wrap JSON array into GitHub Matrix Structure
          MATRIX_JSON=$(jq -n --argjson pkgs "$JSON_ARRAY" '{package: $pkgs}')

          # 5. Send matrix definition to GitHub Workflow Output
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ==========================================================
  # STAGE 3: BLFS 13.0-SYSTEMD PARALLEL COMPILATION (JOBS 12+)
  # ==========================================================

  build-blfs-packages:
    needs: [lfs-10-finalize-lfs, generate-blfs-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-blfs-matrix.outputs.matrix) }}
    steps:
      - name: Download LFS System Base
        uses: actions/download-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

      - name: Build BLFS Module (${{ matrix.package }})
        run: |
          echo "Compiling BLFS 13.0 Package Target: ${{ matrix.package }}"
          # Executes chroot compilation commands inside $LFS targeting BLFS systemd packages

      - name: Upload Module Output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-binary
          path: ${{ github.workspace }}/lfs/usr/

  # ==========================================================
  # STAGE 4: PACKAGE FINAL DISTRO TARBALL (JOB 13)
  # ==========================================================

  package-systemd-distro:
    needs: build-blfs-packages
    runs-on: ubuntu-latest
    steps:
      - name: Download LFS System Base
        uses: actions/download-artifact@v4
        with:
          name: lfs-base-ready
          path: ${{ github.workspace }}/lfs

      - name: Compress System to tar.gz Archive
        run: |
          tar -czvf lfs-blfs-13.0-systemd.tar.gz -C ${{ github.workspace }}/lfs .

      - name: Upload Final OS Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfs-blfs-13.0-systemd-release
          path: lfs-blfs-13.0-systemd.tar.gz
          retention-days: 30
